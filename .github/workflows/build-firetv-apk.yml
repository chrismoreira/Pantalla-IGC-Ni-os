name: Build Fire TV APK

on:
  workflow_dispatch:
    inputs:
      allow_debug_only:
        description: "Build debug APK only (artifact only; does NOT publish firetv-latest)"
        type: boolean
        default: false
  push:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Fire TV APK
        working-directory: firetv-apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_DEBUG_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_debug_only }}
        run: |
          set -euo pipefail
          HAS_RELEASE_SECRETS=0
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            HAS_RELEASE_SECRETS=1
          fi

          if [ "$HAS_RELEASE_SECRETS" = "1" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            gradle assembleRelease -PAPP_VERSION_CODE=${{ github.run_number }} --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Pantalla-IGC-FireTV.apk
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            # Hygiene: do not leave the keystore on the runner disk longer than needed
            shred -u "${RUNNER_TEMP}/release.keystore" 2>/dev/null || rm -f "${RUNNER_TEMP}/release.keystore"
          elif [ "${ALLOW_DEBUG_ONLY}" = "true" ]; then
            echo "::warning::Building ephemeral debug APK. This signature changes per runner and CANNOT update an installed app."
            gradle assembleDebug -PAPP_VERSION_CODE=${{ github.run_number }} --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Pantalla-IGC-FireTV.apk
            echo "SIGNING_MODE=debug-ephemeral" >> "$GITHUB_ENV"
          else
            {
              echo "::error::Missing GitHub Actions secrets for a stable release keystore."
              echo "Configure these repository secrets, then re-run this workflow:"
              echo "  ANDROID_KEYSTORE_BASE64   (base64 of the .jks/.keystore file)"
              echo "  ANDROID_KEYSTORE_PASSWORD"
              echo "  ANDROID_KEY_ALIAS"
              echo "  ANDROID_KEY_PASSWORD"
              echo "See firetv-apk/README.md (section Firma / actualizaciones)."
              echo "For a one-off debug artifact only, use workflow_dispatch with allow_debug_only=true (will not publish firetv-latest)."
            } >&2
            exit 1
          fi

      - name: Verify APK is signed
        if: env.SIGNING_MODE == 'release'
        run: |
          set -euo pipefail
          jarsigner -verify -strict Pantalla-IGC-FireTV.apk
          echo "APK jarsigner verification OK (stable release keystore)."

      - name: Upload Fire TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pantalla-IGC-FireTV-APK
          path: Pantalla-IGC-FireTV.apk
          if-no-files-found: error

      - name: Generate detailed Release Notes
        if: env.SIGNING_MODE == 'release'
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          SHORT_SHA=$(git rev-parse --short HEAD)
          SHORT_TITLE=$(printf '%s' "$COMMIT_TITLE" | head -n 1 | cut -c1-72)

          printf 'RELEASE_TITLE=%s\n' "Pantalla IGC Fire TV (v1.0.${{ github.run_number }}) — ${SHORT_TITLE}" >> "$GITHUB_ENV"

          {
            printf '## Pantalla IGC Fire TV · v1.0.%s [vc:%s]\n\n' "${{ github.run_number }}" "${{ github.run_number }}"
            printf '**Commit:** `%s` — %s\n' "$SHORT_SHA" "$COMMIT_TITLE"
            printf '**Firma:** Release persistente (mismo keystore en Actions → actualizable sin desinstalar)\n'
            printf '\n> **Migración desde builds debug:** si el Fire TV tiene la app instalada con firma debug temporal, hay que **desinstalar una vez** e instalar este APK release. Después, las actualizaciones del tag `firetv-latest` sí se aplican encima.\n'
            if [ -n "$COMMIT_BODY" ]; then
              printf '\n%s\n' "$COMMIT_BODY"
            fi
            printf '\n### Archivos modificados en este release\n'
            git diff-tree --root --no-commit-id --name-status -r HEAD | sed 's/^/- `/; s/\t/` — /' || printf '%s\n' '- Sin detalle de archivos'
            printf '\n### Últimos cambios recientes\n'
            git log -n 5 --pretty=format:"- \`%h\` (%ad) **%s**" --date=short
            printf '\n'
          } > release-notes.md

      - name: Publish direct APK to Releases (latest)
        if: env.SIGNING_MODE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-latest
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          files: Pantalla-IGC-FireTV.apk
          make_latest: true
