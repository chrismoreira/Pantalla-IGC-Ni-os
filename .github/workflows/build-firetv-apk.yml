name: Build Fire TV APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Fire TV APK
        working-directory: firetv-apk
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK filename
        run: cp firetv-apk/app/build/outputs/apk/debug/app-debug.apk Pantalla-IGC-FireTV.apk

      - name: Upload Fire TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pantalla-IGC-FireTV-APK
          path: Pantalla-IGC-FireTV.apk
          if-no-files-found: error

      - name: Publish direct APK to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-latest
          name: Pantalla IGC Fire TV
          body: APK nativa gratuita para Amazon Fire TV
          files: Pantalla-IGC-FireTV.apk
          make_latest: true
