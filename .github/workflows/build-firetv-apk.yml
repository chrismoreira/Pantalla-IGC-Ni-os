name: Build Fire TV APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Fire TV APK
        working-directory: firetv-apk
        run: gradle assembleDebug -PAPP_VERSION_CODE=${{ github.run_number }} --no-daemon

      - name: Prepare APK filename
        run: cp firetv-apk/app/build/outputs/apk/debug/app-debug.apk Pantalla-IGC-FireTV.apk

      - name: Upload Fire TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pantalla-IGC-FireTV-APK
          path: Pantalla-IGC-FireTV.apk
          if-no-files-found: error

      - name: Publish direct APK to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-latest
          name: Pantalla IGC Fire TV (v1.0.${{ github.run_number }})
          body: "APK nativa gratuita para Amazon Fire TV [vc:${{ github.run_number }}]"
          files: Pantalla-IGC-FireTV.apk
          make_latest: true
